name: KidBonus
options:
  bundleIdPrefix: com.kidbonus
  deploymentTarget:
    iOS: "18.0"
settings:
  SWIFT_VERSION: "6.0"
  IPHONEOS_DEPLOYMENT_TARGET: "18.0"
  MARKETING_VERSION: "0.1.1"
  CURRENT_PROJECT_VERSION: "1"
  # 开发者团队，自动签名用（实机安装 / Archive 都靠它）
  DEVELOPMENT_TEAM: T6VUXC35PV
  CODE_SIGN_STYLE: Automatic
targets:
  KidBonus:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Models
      - path: Theme
      - path: Store
      - path: Resources/Assets.xcassets
      - path: Resources/Fonts/LXGWWenKai-Regular.ttf
      - path: Resources/Fonts/LXGWWenKai-Light.ttf
      - path: Resources/Fonts/OFL.txt
      - path: Views
    info:
      path: Info.plist
      properties:
        # Info.plist 由 xcodegen 生成，版本号在这里给，用构建变量保持一致
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIAppFonts:
          - LXGWWenKai-Regular.ttf
          - LXGWWenKai-Light.ttf
        CFBundleDisplayName: 成长树
        UIRequiresFullScreen: true
        UIStatusBarStyle: UIStatusBarStyleDefault
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.kidbonus.growingtree
      INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
      INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  KidBonusTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ../KidBonusTests
    dependencies:
      - target: KidBonus
    settings:
      GENERATE_INFOPLIST_FILE: YES
      INFOPLIST_KEY_UILaunchScreen_Generation: YES
  KidBonusUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ../KidBonusUITests
    dependencies:
      - target: KidBonus
    settings:
      GENERATE_INFOPLIST_FILE: YES
      TEST_TARGET_NAME: KidBonus
schemes:
  KidBonus:
    build:
      targets:
        KidBonus: all
        KidBonusTests: [test]
        KidBonusUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      environmentVariables:
        DISABLE_SWIFTUI_IN_TESTS: "1"
      targets:
        - KidBonusTests
        - KidBonusUITests
